# Gear set bonuses — placed into the formula's groups.
#
# Format — see README.md next to this file. A bonus turns on at `pieces` items
# of the set (3 by default). `seen` is the text from the item pages: for a set
# they are the truth, not the set page or the mechanic pages, which retell set
# texts and can lag a patch behind (measurements, #24).
#
# Sets without a bonus (`Basic`, `Miner α/β/γ`, `Redeemer`, `Rift Trekker`)
# are not recorded: there is nothing to place.

sets:
  - name: AIC Fieldwork
    confidence: confirmed
    evidence: "measurements #23: Pogranichnik's screen — Physical 30 % = 20 set + 10 P2, elements 20 % each; Breach 5023 / 3856"
    seen: "3-piece set effect: Wearer gains DMG Dealt +20% for all types of DMG, 10% DMG Reduction against all types of DMG, and Ultimate Gain Efficiency +10%."
    apply:
      - {stat: dmg_bonus, value: 20}
      - {stat: dmg_reduction, value: 10}
      - {stat: ult_gain_eff, value: 10}

  - name: AIC Heavy
    confidence: inferred
    seen: "3-piece set effect: Wearer's HP +500. \nAfter the wearer defeats an enemy, the wearer restores 100 HP. Effect trigger cooldown: 5s."
    apply:
      - {stat: hp_flat, value: 500}
    unmodeled: "100 HP per kill — there are no kills on the dummy"

  - name: AIC Light
    confidence: inferred
    seen: "3-piece set effect: Wearer's HP +500. \nAfter the wearer defeats an enemy, the wearer gains ATK +20 for 5s."
    apply:
      - {stat: hp_flat, value: 500}
    unmodeled: "ATK +20 for 5 s per kill — there are no kills on the dummy"

  - name: Aburrey's Legacy
    confidence: inferred
    seen: "3-piece set effect: Wearer's Skill DMG +24%. \nWhen the wearer casts a battle skill, combo skill, or ultimate, the wearer gains ATK +5% for 15s. The buff from each of the three skill types is unique and does not stack with itself."
    apply:
      - {stat: atk_pct, value: 5, duration: 15, trigger: "cast:Battle Skill", target: self}
      - {stat: atk_pct, value: 5, duration: 15, trigger: "cast:Combo Skill", target: self}
      - {stat: atk_pct, value: 5, duration: 15, trigger: "cast:Ultimate", target: self}
      - {stat: dmg_bonus, skillType: Battle Skill, value: 24}
      - {stat: dmg_bonus, skillType: Combo Skill, value: 24}
      - {stat: dmg_bonus, skillType: Ultimate, value: 24}
    evidence: "«Skill DMG» is battle skill, combo and ultimate, not basic attacks: the stat screen shows Tide Surge's +20 % as three lines, and Si's basic hit did not take it (measurements, #38)"

  - name: Armored MSGR
    confidence: inferred
    seen: "3-piece set effect: Wearer's Strength +50. \nWhen the wearer's HP is below 50%, the wearer gains 30% DMG Reduction against all types of DMG."
    apply:
      - {stat: attr, attribute: STR, value: 50}
    unmodeled: "DMG Reduction 30 % below 50 % HP"

  - name: Bonekrusha
    confidence: inferred
    seen: "3-piece set effect: Wearer's ATK +15%. \nWhen the wearer casts a combo skill, the wearer gains 1 stack of Bonekrushing Smash that grants the wearer's next battle skill DMG Dealt +30%. Bonekrushing Smash can stack 2 time(s)."
    apply:
      - {stat: atk_pct, value: 15}
      - {stat: dmg_bonus, skillType: Battle Skill, value: 30, stacks: {max: 2}, trigger: "cast:Combo Skill", spentBy: "cast:Battle Skill", target: self, name: Bonekrushing Smash}
    note: "on the track the stacks are spent by the next battle skill; the «up» assumption in the editor keeps them on every battle skill"

  - name: Catastrophe
    confidence: inferred
    seen: "3-piece set effect: Wearer's Ultimate Gain Efficiency +20%.\nThe wearer casts a battle skill, the action returns 50 SP. This effect only triggers 1 time per battle."
    apply:
      - {stat: ult_gain_eff, value: 20}
    unmodeled: "50 SP for a battle skill — once per fight"

  - name: Deep Rampart
    confidence: inferred
    evidence: "measurements #6: datamine passive_equipsuit_spellburst01 matches the item text"
    seen: "3-piece set effect: Wearer's Arts DMG Dealt +16%.\nWhen the wearer applies Nature Burst or Cryo Burst, the wearer gains Arts Intensity +16 for 20s. Max stacks for this effect: 3. Duration of each stack is counted separately. Effect only triggers once every 0.1s."
    apply:
      - {stat: dmg_bonus, element: Arts, value: 16}
      - {stat: arts_intensity, value: 16, stacks: {max: 3}, duration: 20, trigger: "applies:Nature Burst|applies:Cryo Burst", target: self}

  - name: Eternal Xiranite
    confidence: confirmed
    evidence: "measurements #29: Lifeng 1839 → 2048; an elemental Amp turns it on too; does not stack from two wearers"
    seen: "3-piece set effect: Wearer's HP +1000.\nAfter the wearer applies Amp, Protection, Susceptibility, or Weakness, other teammates gain DMG Dealt +16% for 15s. This effect cannot stack."
    apply:
      - {stat: hp_flat, value: 1000}
      - {stat: dmg_bonus, value: 16, duration: 15, trigger: "applies:Amp|applies:Protection|applies:Susceptibility|applies:Weakness", target: others}

  - name: Frontiers
    confidence: confirmed
    evidence: "measurements #4 and #23: team DMG +16 % after an SP refund, in one group with Physical DMG"
    seen: "3-piece set effect: Wearer's Combo Skill Cooldown Reduction +15%.\nAfter the wearer's skill recovers SP, the team gains DMG +16% for 15s. This effect cannot stack."
    apply:
      - {stat: cooldown_pct, skillType: Combo Skill, value: -15}
      - {stat: dmg_bonus, value: 16, duration: 15, trigger: sp_recovered, target: team}

  - name: Grizzled Edge
    confidence: confirmed
    evidence: "measurements #24: ATK 5765 / 4848 with and without the set; ×1.5 on a target with crystals — #12"
    seen: "3-piece set effect: Wearer's ATK +8%.\nWhen the wearer applies Crush or Breach, the wearer gains Physical DMG Dealt +[6% × Max number of Vulnerability stacks consumed from one enemy] for 20s. If the target already has Physical Susceptibility, is Staggered, or has attached Originium Crystals, increase the aforementioned buff to 1.5 times. This buff cannot stack."
    apply:
      - {stat: atk_pct, value: 8}
      - {stat: dmg_bonus, element: Physical, value: 6, stacks: {max: 4, from: consumed}, duration: 20, trigger: "applies:Crush|applies:Breach", target: self}
    note: "stacks are consumed Vulnerability stacks, hence the cap of 4"
    unmodeled: "×1.5 to the Physical bonus if the target has Physical Susceptibility, crystals or is Staggered (Staggered — by the text, unmeasured)"

  - name: Hot Work
    confidence: inferred
    seen: "3-piece set effect: Wearer's Arts Intensity +30. \nAfter the wearer applies Combustion, the wearer gains Heat DMG +50% for 10s. After the wearer applies Corrosion, the wearer gains Nature DMG +50% for 10s. The aforementioned effects cannot stack."
    apply:
      - {stat: arts_intensity, value: 30}
      - {stat: dmg_bonus, element: Heat, value: 50, duration: 10, trigger: "applies:Combustion", target: self}
      - {stat: dmg_bonus, element: Nature, value: 50, duration: 10, trigger: "applies:Corrosion", target: self}

  - name: LYNX
    confidence: inferred
    seen: "3-piece set effect: Wearer's HP Treatment Efficiency +20%. \nAfter the wearer gives HP treatment to an allied target, that target also gains 15% DMG Reduction against all types of DMG for 10s. If the said treatment exceeds the target's Max HP, the target gains 30% DMG Reduction against all types of DMG. The aforementioned effects cannot stack."
    apply:
      - {stat: treatment, value: 20}
    unmodeled: "DMG Reduction for the healed — defence, does not affect damage"

  - name: MI Security
    confidence: inferred
    seen: "3-piece set effect: Wearer's Critical Rate +5%. \nAfter the wearer scores a critical hit, the wearer gains ATK +5% for 5s. This effect can reach 5 stacks. At max stacks, grant an additional Critical Rate +5%. This effect cannot stack."
    apply:
      - {stat: crit_rate, value: 5}
      - {stat: atk_pct, value: 5, stacks: {max: 5}, duration: 5, trigger: crit, target: self}
    unmodeled: "Critical Rate +5 % at five stacks"

  - name: Mordvolt Insulation
