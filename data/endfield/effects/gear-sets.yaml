    confidence: inferred
    seen: "3-piece set effect: Wearer's Arts Intensity +30. \nAfter the wearer applies Electrification, the wearer gains Electric DMG+50% for 10s. After the wearer applies Solidification, the wearer gains Cryo DMG+50% for 10s. The aforementioned effects cannot stack."
