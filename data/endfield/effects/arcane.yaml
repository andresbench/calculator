# Arcane. Two stances by attribute, so almost everything hinges on INT versus WIL.
operator: Arcane

talents:
  - name: Keen Mind/Stalwart
    stacking: cumulative
    confidence: confirmed
    evidence: >-
      Checked in game 2026-09-12: attribute talents add up — the stat
      screen shows the sum of the tiers. For tiered talents the game instead
      draws a selector and ticks the strongest tier itself (seen on Antal's
      "Improviser"), so those replace rather than add (measurements, #22).
    levels:
      - condition: Elite 1
        seen: "Operator Intellect and Will +8."
        apply:
          - {stat: attr, attribute: INT, value: 8}
          - {stat: attr, attribute: WIL, value: 8}
      - condition: Elite 2
        seen: "Operator Intellect and Will +10."
        apply:
          - {stat: attr, attribute: INT, value: 10}
          - {stat: attr, attribute: WIL, value: 10}
      - condition: Elite 3
        seen: "Operator Intellect and Will +10."
        apply:
          - {stat: attr, attribute: INT, value: 10}
          - {stat: attr, attribute: WIL, value: 10}
      - condition: Elite 4
        seen: "Operator Intellect and Will +15."
        apply:
          - {stat: attr, attribute: INT, value: 15}
          - {stat: attr, attribute: WIL, value: 15}

  - name: Tactical Planning
    levels:
      - condition: Elite 0
        unmodeled: "stance choice by INT versus WIL; the build sets the stance, not an effect"
      - condition: Elite 2
        unmodeled: "Arts Amp 24 % during the ultimate in the INT stance and Susceptibility from Will in the WILL stance — both depend on the stance and the ultimate's duration"

  - name: Weapon Honing
    stacking: replaces
    confidence: inferred
    evidence: >-
      Client (buff_chr_0032_lizhiyan_talent2): multiplies only Corrosion's
      max_def_decrease and adds duration; the initial shred and the step are
      untouched. Tier numbers are from the text.
    levels:
      - condition: Elite 1
        seen: "Corrosion applied by Arcane lasts 5s longer, and Max Resistance Reduction is increased to 1.05 times the original."
        apply:
          - {stat: reaction_duration, reaction: Corrosion, value: 5}
          - {stat: reaction_max, reaction: Corrosion, value: 5}
      - condition: Elite 3
        seen: "Corrosion applied by Arcane lasts 10s longer, and Max Resistance Reduction is increased to 1.1 times the original."
        apply:
          - {stat: reaction_duration, reaction: Corrosion, value: 10}
          - {stat: reaction_max, reaction: Corrosion, value: 10}

