      - {stat: dmg_bonus, element: Nature, value: "{1}", stacks: {max: 4, from: consumed}, duration: 20, trigger: "consumes:Arts Infliction", target: self}
    note: "stacks are the number of infliction stacks consumed, hence the cap of 4"

