# Named weapon effects — placed into the formula's groups.
#
# Format — see README.md next to this file. One difference from operators:
# instead of a number, `value: "{1}"` gives the placeholder index in the text
# template. Which of the nine values applies is decided by the specific item's
# essence (the column, tools/ef/weapon.py), and the engine picks it.
#
# Stat components (`Agility [L]`, `ATK [L]`, `Physical DMG [M]`…) are not
# written here: their placement is mechanical and lives in effects.py,
# STATIC_COMPONENTS.
#
# `seen` is the wiki's text template (with placeholders), not text with numbers.

weapons:
  - name: Glorious Memory
    confidence: confirmed
    evidence: "measurements #60: Chen's stat screen, ATK 4582 = (297 + 490) × (1 + 16.8 % at column 8) × AttributeBonus; after her battle skill on a fresh boss two buffs stood — her talent's ATK +8 % and this weapon's stack from the Lift that became Vulnerable"
    seen: "ATK +{0}%. When the wielder's skill applies Vulnerability, during the next ultimate cast within 30.00s, the wielder gains DMG Dealt +{1}%. Max stacks for effects of the same name: 3.00. Duration of each stack is counted separately. Effect only triggers once every 0.5s."
    apply:
      - {stat: atk_pct, value: "{0}"}
      - {stat: dmg_bonus, skillType: Ultimate, value: "{1}", stacks: {max: 3}, duration: 30, trigger: "applies:Vulnerable", spentBy: "cast:Ultimate", target: self, name: Lingering Glow}
    note: "«Effect only triggers once every 0.5s» — one stack per step on the track"

  - name: Grand Vision
    confidence: confirmed
    evidence: "measurements #24: Endministrator's screen, Arts Intensity 108 → 64 without the gloves"
    seen: "Arts Intensity +{0}. When the wielder applies Originium Crystals or Solidification, during the next battle skill or ultimate cast within 20.00s, the wielder gains Physical DMG Dealt +{1}%. Effects of the same name cannot stack."
    apply:
      - {stat: arts_intensity, value: "{0}"}
      - {stat: dmg_bonus, element: Physical, value: "{1}", duration: 20, trigger: "applies:Originium Crystals|applies:Solidification", spentBy: "cast:Battle Skill|cast:Ultimate", target: self}
    note: "on the track the bonus is spent by the next battle skill or ultimate; the «up» assumption in the editor applies it to every hit"

  - name: Thermite Cutter
    confidence: confirmed
    evidence: "measurements #23: weapon ATK % 0.55 = 39 % + 16 % (4/4); Pogranichnik's battle skill refunded SP → ATK +8 %"
    seen: "ATK +{0}%. After the wielder's skill recovers SP or grants a Link state, the entire team gains ATK +{1}% for 20.00s. Max stacks for effects of the same name: 2.00. Duration of each stack is counted separately."
    apply:
      - {stat: atk_pct, value: "{0}"}
      - {stat: atk_pct, value: "{1}", stacks: {max: 2}, duration: 20, trigger: "sp_recovered|applies:Link", target: team}

  - name: Valiant
    confidence: confirmed
    evidence: "measurements #6 (weapon screen 4/4: ATK +16 %), #36 (Lifeng's screen 3656)"
    seen: "ATK +{0}%. After the wielder applies Physical Statuses, the wielder also deals another hit of Physical DMG equal to {1}% of the wielder's ATK."
    apply:
      - {stat: atk_pct, value: "{0}"}
      # The extra hit: an instance, as Swordmancer's (`extra_hit`, measurements
      # #60). No cooldown in the text; unmeasured.
      - {stat: extra_hit, element: Physical, value: "{1}", trigger: "applies:Physical Status", target: self, name: Valiant hit}

  - name: Aspirant
    confidence: inferred
