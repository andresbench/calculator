  - name: Amaranthine Tassel
    confidence: inferred
    seen: "Physical DMG Dealt +{0}%. When the wielder applies Physical Susceptibility, the wielder gains Arts Intensity +{1} for 20.00s. When the wielder applies Crush, the wielder gains Physical DMG Dealt +[{2}% + ({3}% × Max number of Vulnerability stacks consumed from one enemy)] for 30.00s. The two effects apply separately and do not stack with themselves."
    apply:
      - {stat: dmg_bonus, element: Physical, value: "{0}"}
      - {stat: arts_intensity, value: "{1}", duration: 20, trigger: "applies:Physical Susceptibility", target: self}
      - {stat: dmg_bonus, element: Physical, value: "{2}", duration: 30, trigger: "applies:Crush", target: self}
      - {stat: dmg_bonus, element: Physical, value: "{3}", stacks: {max: 4, from: consumed}, duration: 30, trigger: "applies:Crush", target: self}
    note: "after Crush: a flat part and a part per Vulnerability stack the Crush consumed (two rows of one effect)"

