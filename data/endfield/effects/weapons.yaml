    seen: "Ultimate DMG Dealt +{0}%. After the wielder applies Lift, during the next ultimate cast within 30.00s, the wielder gains Physical DMG Dealt +{1}%. Max stacks for effects of the same name: 3.00. Duration of each stack is counted separately. Effect only triggers once every 0.5s."
    apply:
      - {stat: dmg_bonus, skillType: Ultimate, value: "{0}"}
    unmodeled: "Physical DMG for Lift — only for the next ultimate and only Physical; the vocabulary does not combine two filters"

  - name: Sundering Steel
    confidence: inferred
