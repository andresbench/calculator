    apply:
      - {stat: atk_pct, value: "{0}"}
      - {stat: atk_pct, value: "{1}", stacks: {max: 2}, duration: 20, trigger: "applies:Physical Status", target: self}

  - name: Beacon of Duty
    confidence: confirmed
    evidence: "measurements #4: team Physical +8 % after Camille's Heat Susceptibility (column 6)"
    seen: "Heat DMG Dealt +{0}%. When the wielder's skill applies Heat Infliction, the wielder gains Physical and Heat DMG Dealt +{1}% for 20.00s. When the wielder's skill applies Heat Susceptibility, the entire team gains Physical and Heat DMG Dealt +{2}% for 30.00s. The two effects apply separately and do not stack with themselves."
    apply:
      - {stat: dmg_bonus, element: Heat, value: "{0}"}
      - {stat: dmg_bonus, element: Physical, value: "{1}", duration: 20, trigger: "applies:Heat Infliction", target: self}
      - {stat: dmg_bonus, element: Heat, value: "{1}", duration: 20, trigger: "applies:Heat Infliction", target: self}
      - {stat: dmg_bonus, element: Physical, value: "{2}", duration: 30, trigger: "applies:Heat Susceptibility", target: team}
      - {stat: dmg_bonus, element: Heat, value: "{2}", duration: 30, trigger: "applies:Heat Susceptibility", target: team}

  - name: Lunar Calling
    confidence: inferred
    evidence: "measurements #59: Argent Flow's AI 78 = 30 (Pulser Labs) + 48 (column 4); the Endministrator's ATK 5765 → 6236 after Bolt Rush; the explosion 87,292 fits column 4 (team ATK +12 %, Electric +19.2 %) with Pulser Labs' +50 %"
    seen: "Arts Intensity +{0}. When wielder's skill applies Electrification, the entire team gains ATK +{1}% for 20.00s. When the wielder consumes Arts Infliction, the wielder gains Electric DMG Dealt +{2}% for 20.00s. The two effects apply separately and do not stack with themselves."
    apply:
      - {stat: arts_intensity, value: "{0}"}
      - {stat: atk_pct, value: "{1}", duration: 20, trigger: "applies:Electrification", target: team}
      - {stat: dmg_bonus, element: Electric, value: "{2}", duration: 20, trigger: "consumes:Arts Infliction", target: self}

  - name: Lupine Scarlet
    confidence: inferred
    evidence: "measurements #27.3: basic attacks stack Wolven Blood too"
    seen: "ATK +{0}%. After the wielder's skill deals Critical DMG, the wielder gains 1 stack of Wolven Blood that grants Physical and Heat DMG Dealt +{1}%. Wolven Blood can reach 16.00 stacks. After reaching 16.00 stacks, the wielder gains another Physical and Heat DMG Dealt +{2}% for 20.00s. After the duration ends, all Wolven Blood stacks are removed."
    apply:
      - {stat: atk_pct, value: "{0}"}
      - {stat: dmg_bonus, element: Physical, value: "{1}", stacks: {max: 16}, trigger: crit, target: self, name: Wolven Blood}
      - {stat: dmg_bonus, element: Heat, value: "{1}", stacks: {max: 16}, trigger: crit, target: self, name: Wolven Blood}
    unmodeled: "+{2} % Physical and Heat for 20 s at 16 Wolven Blood stacks"

  - name: Jade Vessel
    confidence: confirmed
    evidence: "measurements #29: DMG Taken +12 % on the target after Immobilization"
    seen: "ATK +{0}%. When the wielder applies Immobilization on the enemy, the target enemy suffers DMG Taken +{1}% for 30.00s. When the wielder applies Immobilization on the enemy or after the wielder casts an ultimate, the next combo skill cast within 20.00s gains DMG Dealt +{2}%. The two effects apply separately and do not stack with themselves."
    apply:
      - {stat: atk_pct, value: "{0}"}
      - {stat: dmg_taken, value: "{1}", duration: 30, trigger: "applies:Immobilization", target: enemy}
      - {stat: dmg_bonus, skillType: Combo Skill, value: "{2}", duration: 20, trigger: "applies:Immobilization|cast:Ultimate", spentBy: "cast:Combo Skill", target: self}

  - name: Junction Point
    confidence: inferred
    seen: "Nature DMG Dealt +{0}%. When the wielder applies Arts Susceptibility or Arts Infliction with a combo skill, the wielder gains ATK +{1}% while other operators in the team gain ATK +{2}%. Duration: 20.00s. Max stacks for effects of the same name: 2.00. Duration of each stack is counted separately."
    apply:
      - {stat: dmg_bonus, element: Nature, value: "{0}"}
      - {stat: atk_pct, value: "{1}", stacks: {max: 2}, duration: 20, trigger: "applies:Arts Susceptibility@Combo Skill|applies:Arts Infliction@Combo Skill", target: self, teamShare: 0.25}
    note: "triggers only from the combo skill; team share {2}/{1} = 0.25 in every column"

