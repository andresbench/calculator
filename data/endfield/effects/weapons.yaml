    apply:
      - {stat: dmg_bonus, element: Cryo, value: "{1}", duration: 15, trigger: "applies:Cryo Infliction@Battle Skill", target: self}
      - {stat: dmg_bonus, element: Cryo, value: "{2}", duration: 15, trigger: "cast:Combo Skill", targetHas: [Cryo Infliction], target: self}
      - {stat: dmg_bonus, skillType: Battle Skill, value: "{0}"}
      - {stat: dmg_bonus, skillType: Combo Skill, value: "{0}"}
      - {stat: dmg_bonus, skillType: Ultimate, value: "{0}"}
    evidence: "«Skill DMG … for every skill» — battle skill, combo, ultimate; basic attacks do not take it (measurements, #38, on Tide Surge)"

