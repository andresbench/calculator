    apply:
      - {stat: dmg_bonus, element: Physical, value: "{0}"}
      - {stat: dmg_bonus, element: Physical, value: "{1}", stacks: {max: 5}, duration: 30, trigger: sp_recovered, target: self, teamShare: 0.5}
    note: "team share {2}/{1} = 0.5 in every column"

