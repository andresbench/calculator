# Operator aliases for hand-written rotations.
#
# The key is the name in the data (data/endfield/operators.json); the values are
# any spellings, Russian ones included — they are data, not comments. Case and
# spaces are ignored when parsing, so "Ми фу", "мифу" and "МиФу" all work.

